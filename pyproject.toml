[project]
name = "recoup"
version = "0.1.0"
description = "A recovery decisioning control plane: diagnose at-risk revenue, choose bounded interventions under hard compliance gates, and prove incremental lift."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    # The Razorpay client imports httpx at module level, so this is core -- the
    # execution path does not exist without it.
    "httpx>=0.27",
    # Propensity model and bandit. numpy/sklearn are core because the default
    # strategy imports featurise for its feature dimension.
    "numpy>=2.0",
    "scikit-learn>=1.5",
    # Windows ships no system zoneinfo database; IST is load-bearing for the
    # quiet-hours gate, so this is a hard dependency, not a dev convenience.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
llm = [
    # Tier-2 escalation only. Deliberately optional: with it absent, an unmapped
    # error code routes to a human, which is the same thing tier 2 does when it is
    # unsure -- so the system behaves identically, just with more ops tickets.
    "anthropic>=0.40",
]
workflows = [
    # Durable multi-day recovery sequences. Optional: without it the engine still
    # handles single decisions, it just cannot follow one across days.
    "temporalio>=1.8",
]
console = [
    # Ops console API. Optional: the engine, gates, ledger and CLI demo all run
    # without it -- it exists so a human can drain the approval and rule queues.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recoup"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# The SDK is an optional extra and is imported lazily inside ClaudeEscalator, so
# type checking must pass with or without it installed.
module = ["anthropic", "anthropic.*", "sklearn.*", "temporalio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "workflow: needs Temporal's time-skipping test server (downloads a binary on first run)",
]
