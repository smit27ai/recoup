[project]
name = "recoup"
version = "0.1.0"
description = "A recovery decisioning control plane: diagnose at-risk revenue, choose bounded interventions under hard compliance gates, and prove incremental lift."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    # Windows ships no system zoneinfo database; IST is load-bearing for the
    # quiet-hours gate, so this is a hard dependency, not a dev convenience.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recoup"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
